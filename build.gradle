plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Hangi Minecraft sürümü derlenecek: gradle.properties'teki varsayılan,
// komut satırından -PmcVer=26.3 ile ezilebilir
def mcVer = project.property("mcVer")

def versionPropsFile = file("versions/${mcVer}/gradle.properties")
if (!versionPropsFile.exists()) {
	throw new GradleException("versions/${mcVer}/gradle.properties not found!")
}
def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }
// Değerleri projeye aktar (project.minecraft_version vb. böyle çalışır)
versionProps.each { k, v -> project.ext.set(k.toString(), v.toString()) }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "minecraft_depends", project.minecraft_depends
	inputs.property "loader_version", project.loader_version

	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"minecraft_depends": project.minecraft_depends,
				"loader_version": project.loader_version
	}
}

def javaVer = Integer.parseInt(project.java_version)

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVer
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVer)
	targetCompatibility = JavaVersion.toVersion(javaVer)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}